name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.3"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "AspectShift-HtoV ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## AspectShift-HtoV ${{ env.RELEASE_TAG }}

            This update adds a detachable preview window, replaces the single logo with flexible multi-image overlays, makes text and subtitle placement match the final video, adds a background color choice, expands export quality controls, and tunes platform presets to better match upload guidance with quicker default encoding settings.

            ### New Features

            - Detachable preview window: open the preview in a separate resizable window with the same video, overlays, and tools. Changes stay as a draft until you choose Apply; closing the window discards the draft.
            - Multi-image overlays replace the single logo: add up to 128 images, place them anywhere including partly off-frame, resize with corner and edge handles, rotate with the round handle, flip horizontally or vertically, crop inside the image, adjust opacity, and use animated GIFs as moving overlays.
            - Faster image editing on the canvas: duplicate an image with an offset, nudge with arrow keys, duplicate with Ctrl+D, and remove with Delete. Adding images stays available even when no image is selected.
            - Text overlays work like images: resize directly on the canvas to change size, rotate freely, drag anywhere without snapping back, and duplicate without shifting toward the frame.
            - Background Color picker: choose any color for the empty bars around the video instead of only white. Defaults to black, and older settings still load.
            - More export quality choices: 10 levels from highest quality to smallest file (previously 3), with clearer speed and audio-bitrate options and a live preview of the effective settings.

            ### Improvements

            - What you see matches the exported video: text size and overlay and subtitle positions in the preview now match the saved file, including corrected text rendering and preview scaling.
            - Free placement for everything: text, images, and manually positioned subtitles accept any position, including outside the frame; the frame only clips what is visible.
            - Platform presets retuned for uploads and quicker defaults: YouTube (16:9), YouTube Shorts (vertical), Instagram Square, Instagram Reels (vertical), TikTok (vertical), X (landscape 720p), and Reddit (4:5 portrait) now use correct canvas sizes, stereo audio where expected, and quicker default encoding settings. Reels and X include upload-friendly frame-rate and bitrate ceilings that only limit unusually high values and never raise low frame rates. Reddit is clarified as 4:5 portrait.
            - Clearer export guidance: combinations that do not apply (for example speed choices for WebM output, or audio bitrate when audio is removed) show a warning and are handled safely; invalid quality or override combinations are stopped before rendering with a clear message instead of failing mid-render.
            - Safer saving: custom presets and app settings with clearly invalid values (such as out-of-range volume or blur strength, or conflicting background options) are rejected at save time, while previously saved files still open.
            - Batch rendering rework: the queue can now work on more than one video at a time within safe limits checked fresh at each batch start, falling back to one-at-a-time when system information is unclear; it also holds back new jobs when disk space runs low and retries once when a render fails only because system resources were exhausted.
            - Batch queue reliability: clearing a batch and starting a new one no longer mixes progress or results from the previous run; subtitle temporary files are cleaned up after rendering; quick jobs are no longer stuck behind very heavy ones.
            - Preview shortcuts: Space plays or pauses in either preview view (and no longer repeats when held, nor steals typing while editing text); Esc leaves the full-screen preview and restores the previous window state.
            - Pop-out polish: single playback owner so audio never doubles, first frame waits until the picture is ready, volume slider opens only over the Volume control and stays open while dragging, window follows the app theme, and controls auto-hide with a bottom reveal zone.
            - Windows color correctness: app colors no longer show a warm or yellow tint.

            ### Fixes

            - Fixed exported text looking a different size than the preview.
            - Fixed very large text shifting the video in the preview; the frame now clips without becoming scrollable.
            - Fixed the volume slider opening when hovering the Pop-Out button.
            - Fixed duplicate text layers being pulled back toward the frame.
            - Fixed preset quality labels so displayed names match the actual output quality.

          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Publish stable installer filename
        # Tauri v2 has no configuration option for the NSIS installer output
        # filename (NsisConfig only covers template, images, install mode,
        # languages, compression, etc.), so the versioned build output is
        # copied to the stable asset name after the build. The copy is
        # byte-identical, which preserves the Authenticode signature applied
        # at build time. Updater artifacts (.nsis.zip, .sig, latest.json)
        # are never renamed or touched by this step.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nsis_dir="src-tauri/target/release/bundle/nsis"
          stable_name="AspectShift-HtoV-Setup.exe"
          # Locate the versioned NSIS installer produced by the Tauri build.
          # The stable filename cannot match this pattern, so a re-run can
          # never mistake a previous copy for fresh build output.
          mapfile -t installers < <(ls "$nsis_dir"/AspectShift-HtoV_*_x64-setup.exe 2>/dev/null || true)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one NSIS installer in $nsis_dir, found ${#installers[@]}."
            ls -la "$nsis_dir" || true
            exit 1
          fi
          src="${installers[0]}"
          dest="$nsis_dir/$stable_name"
          if [ -e "$dest" ]; then
            echo "::error::Destination $dest already exists; refusing to overwrite."
            exit 1
          fi
          cp "$src" "$dest"
          echo "Copied $(basename "$src") to $stable_name."
          # Replace a previously published stable asset explicitly instead of
          # silently overwriting it, then upload the renamed installer to the
          # same version-specific release tag.
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx "$stable_name"; then
            echo "Removing previously published $stable_name from release $RELEASE_TAG."
            gh release delete-asset "$RELEASE_TAG" "$stable_name" --yes
          fi
          gh release upload "$RELEASE_TAG" "$dest"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx "$stable_name"
          echo "Verified $stable_name is attached to release $RELEASE_TAG."
